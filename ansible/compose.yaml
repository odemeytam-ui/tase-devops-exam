services:
  web:
    build:
      context: ../app
      dockerfile: dockerfile

    ports:
      - "${WEB_PORT:-8080}:5000"

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-flask_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3

    restart: unless-stopped

  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flask_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  test:
    profiles:
      - test

    build:
      context: ../app
      dockerfile: dockerfile

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-flask_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      PYTHONPATH: /app

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ../tests:/tests:ro

    working_dir: /app

    command: >
      sh -c "pip install --no-cache-dir -r /tests/requirements.txt &&
             python -m pytest -v /tests"

volumes:
  postgres_data: